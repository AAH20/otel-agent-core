[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "otel-agent-core"
version = "0.1.0"
description = "Native OpenTelemetry GenAI Semantic Convention (OTel v1.30+) Distributed Tracing Substrate & Causality Graph for Autonomous AI Swarms"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Ahmed Hassan (@AAH20)", email = "founder@a2zsoc.com" }
]
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
